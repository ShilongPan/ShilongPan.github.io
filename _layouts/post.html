---
layout: default
---

<main>
  <article>
    <header>
      <h1>{{ page.title }}</h1>
      <time datetime="{{ page.date | date_to_xmlschema }}" class="post-date">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
      {% if page.categories %}
      <div class="post-categories">
        {% for category in page.categories %}
        <a href="{{ category | slugify | prepend: '/blog/category/' | relative_url }}" class="category-tag">{{ category }}</a>
        {% endfor %}
      </div>
      {% endif %}
    </header>

    <div class="post-content">
      {{ content }}
    </div>

    <nav class="post-nav">
      <a href="{{ '/blog.html' | relative_url }}">← Back to all posts</a>
    </nav>
  </article>
</main>
