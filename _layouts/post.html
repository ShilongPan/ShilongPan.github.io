---
layout: default
---

<main>
  <article>
    <header>
      <h1>{{ page.title }}</h1>
      <time datetime="{{ page.date | date_to_xmlschema }}" class="post-date">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
    </header>

    {% if page.thumbnail %}
    <div class="blog-image">
      <img src="{{ page.thumbnail | relative_url }}" alt="{{ page.title }}">
      {% if page.caption %}
      <span class="image-caption">{{ page.caption }}</span>
      {% endif %}
    </div>
    {% endif %}

    <div class="post-content">
      {{ content }}
    </div>

    <nav class="post-nav">
      <a href="{{ '/blog.html' | relative_url }}">← Back to all posts</a>
    </nav>
  </article>
</main>
