---
layout: default
---

<!-- Gallery layout: image-forward. Content should lead with a hero figure and
     masonry walls; keep prose short. See _projects/ for examples. -->

<main class="proj-main proj-page-gallery">
  <article>
    <header class="proj-header">
      <p class="proj-eyebrow">Project · {{ page.date | date: "%B %Y" }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.status %}
      <span class="project-status status-{{ page.status | downcase | slugify }}">{{ page.status }}</span>
      {% endif %}
    </header>

    <div class="proj-body">
      {{ content }}
    </div>

    <nav class="proj-back">
      <a href="{{ '/projects.html' | relative_url }}">← All projects</a>
    </nav>
  </article>
</main>
