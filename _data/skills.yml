# Skills registry — single source of truth for the résumé skills panel.
# Categories render in the order listed; skills within a category render in
# the order listed. Entry files under _resume/ reference skill IDs only.
#
# Adding a new skill: append ONE item to `skills:` with an existing `category` id.
# Adding a new category: add one item to `categories:` plus the skills that reference it.

categories:
  - id: leadership-management
    name: "Leadership & Management"
  - id: communication
    name: "Communication"
  - id: analytical
    name: "Analytical Skills"
