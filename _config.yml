# ── Site Identity ──
title: Shilong Pan
description: Personal website for CV, projects, and more.
tagline: Developer, researcher, builder.

# ── Theme ──
# theme: jekyll-theme-minimal  # Removed — using custom _layouts/ instead

# ── Jekyll Settings ──
markdown: kramdown
highlighter: rouge

# ── Collections ──
collections:
  resume_entries:
    output: false        # entries are data only — never published as their own pages

# ── URL / Base ──
baseurl: ""
url: ""

# ── Plugins (from Gemfile) ──
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ── Feed ──
feed:
  path: feed.xml

# ── Exclude ──
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - _sass
